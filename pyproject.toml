[project]
name = "flight-info-mcp"
version = "0.1.0"
description = "Stateless MCP server serving today-flight data via Aviationstack and OpenSky."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jimmy Tong" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "tzdata>=2024.1; sys_platform == 'win32' or sys_platform == 'linux'",
]

[project.scripts]
flight-info-mcp = "flight_info_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flight_info_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
